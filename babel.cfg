# Extraction mapping for Babel (pybabel).
# Message ids are the Chinese source strings; _() is a plain string, _n() a countable one.
# The extra names are the settings sheet's own builders: a literal handed to _bind() or
# _switch() is a message id as well, it is only translated later, when a language changes.
# _row() and _block_row() are deliberately NOT listed: ``name:1,2`` means "argument 1 is the
# msgid and argument 2 is its plural form", so declaring them that way turned every row's note
# into a msgid_plural, which gettext never looks up for a plain message and the note stayed
# Chinese in every language. Those two take N() around both literals instead, which is also
# what N() is for - strings Babel cannot reach as a single-argument call.
# Dot-directories (.venv, .probe and friends) hold dependencies and scratch scripts; a literal
# in one of those would otherwise become a shipped message id.
[ignore: **/.*/**]
[ignore: **/build/**]
[ignore: **/dist/**]
[ignore: **/locale/**]
[python: **.py]
keywords=_ _n:1,2 N:1 _bind:2 _switch:1
