# Extraction mapping for Babel (pybabel).
# Message ids are the Chinese source strings; _() is a plain string, _n() a countable one.
# The extra names are the settings window's own builders: a literal handed to _bind(), _label()
# or _form() is a message id as well, it is only translated later, when a language changes.
# N() exists for the strings Babel cannot reach as a call argument, such as dict values.
# Dot-directories (.venv, .probe and friends) hold dependencies and scratch scripts; a literal
# in one of those would otherwise become a shipped message id.
[ignore: **/.*/**]
[ignore: **/build/**]
[ignore: **/dist/**]
[ignore: **/locale/**]
[python: **.py]
keywords=_ _n:1,2 N:1 _bind:2 _label:1 _form:1
